<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 348" role="img" aria-labelledby="flow-title flow-desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="flow-title">AIへの指示と、出てきたものの確認</title>
  <desc id="flow-desc">受け入れ条件を5行書き、AIに作らせ、同じ5行で確認するまでの流れ</desc>

  <defs>
    <marker id="arrowRight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#1F4E79" stroke-width="1.6" stroke-linecap="square"/>
    </marker>
    <marker id="arrowBack" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6368" stroke-width="1.6" stroke-linecap="square"/>
    </marker>
  </defs>

  <style>
    .step-no   { font: 700 12px "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif; fill: #1F4E79; }
    .step-name { font: 700 16px "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif; fill: #1A1D1F; }
    .step-note { font: 400 13px "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif; fill: #5C6368; }
    .cond      { font: 400 12px "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif; fill: #5C6368; }
    .flow-label{ font: 400 12px "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif; fill: #5C6368; }
    .box  { fill: #FFFFFF; stroke: #E3E6E8; stroke-width: 1; }
    .bar  { fill: #1F4E79; }
    .line { stroke: #E3E6E8; stroke-width: 1; }
  </style>

  <rect class="box" x="2" y="24" width="228" height="196"/>
  <rect class="bar" x="2" y="24" width="4" height="196"/>
  <text class="step-no"   x="26" y="50">1</text>
  <text class="step-name" x="26" y="74">条件を5行書く</text>
  <text class="step-note" x="26" y="96">何ができていればOKか</text>

  <line class="line" x1="26" y1="112" x2="206" y2="112"/>
  <text class="cond" x="26" y="132">・一覧が表示される</text>
  <text class="cond" x="26" y="152">・新しく登録できる</text>
  <text class="cond" x="26" y="172">・内容を書き換えられる</text>
  <text class="cond" x="26" y="192">・削除できる</text>
  <text class="cond" x="26" y="212">・日付順に並ぶ</text>

  <line x1="244" y1="122" x2="290" y2="122" stroke="#1F4E79" stroke-width="1.6" marker-end="url(#arrowRight)"/>
  <text class="flow-label" x="246" y="110">渡す</text>

  <rect class="box" x="304" y="58" width="168" height="128"/>
  <rect class="bar" x="304" y="58" width="4" height="128"/>
  <text class="step-no"   x="328" y="84">2</text>
  <text class="step-name" x="328" y="108">AIが作る</text>
  <text class="step-note" x="328" y="134">画面も、裏側の</text>
  <text class="step-note" x="328" y="154">仕組みも、AIが書く</text>

  <line x1="486" y1="122" x2="532" y2="122" stroke="#1F4E79" stroke-width="1.6" marker-end="url(#arrowRight)"/>
  <text class="flow-label" x="484" y="110">出てくる</text>

  <rect class="box" x="546" y="58" width="152" height="128"/>
  <rect class="bar" x="546" y="58" width="4" height="128"/>
  <text class="step-no"   x="570" y="84">3</text>
  <text class="step-name" x="570" y="108">自分で確かめる</text>
  <text class="step-note" x="570" y="134">5行を1つずつ</text>
  <text class="step-note" x="570" y="154">動かして確認</text>

  <path d="M622 194 L622 268 L116 268 L116 232"
        fill="none" stroke="#5C6368" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#arrowBack)"/>
  <text class="flow-label" x="262" y="288">条件を満たしていなければ、書き直してもう一度</text>

  <line class="line" x1="2" y1="314" x2="698" y2="314"/>
  <text class="step-note" x="2" y="338">書いた5行が、そのまま指示書と確認表の両方になります。</text>
</svg>
