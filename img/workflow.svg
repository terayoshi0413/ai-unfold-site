<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-labelledby="flow-title flow-desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="flow-title">AIへの指示と、出てきたものの確認</title>
  <desc id="flow-desc">受け入れ条件を5行書き、AIに作らせ、同じ5行で確認するまでの流れ</desc>

  <defs>
    <marker id="arrowRight" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#1F4E79" stroke-width="1.6" stroke-linecap="square"/>
    </marker>
    <marker id="arrowBack" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#5C6368" stroke-width="1.6" stroke-linecap="square"/>
    </marker>
  </defs>

  <style>
    .step-no   { font: 700 12px "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif; fill: #1F4E79; }
    .step-name { font: 700 16px "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif; fill: #1A1D1F; }
    .step-note { font: 400 13px "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif; fill: #5C6368; }
    .cond      { font: 400 12px "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif; fill: #5C6368; }
    .flow-label{ font: 400 12px "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif; fill: #5C6368; }
    .box  { fill: #FFFFFF; stroke: #E3E6E8; stroke-width: 1; }
    .bar  { fill: #1F4E79; }
    .line { stroke: #E3E6E8; stroke-width: 1; }
  </style>

  <!-- 1. 受け入れ条件を書く -->
  <rect class="box" x="0" y="24" width="228" height="196"/>
  <rect class="bar" x="0" y="24" width="4" height="196"/>
  <text class="step-no"   x="24" y="50">1</text>
  <text class="step-name" x="24" y="74">条件を5行書く</text>
  <text class="step-note" x="24" y="96">何ができていればOKか</text>

  <line class="line" x1="24" y1="112" x2="204" y2="112"/>
  <text class="cond" x="24" y="132">・一覧が表示される</text>
  <text class="cond" x="24" y="152">・新しく登録できる</text>
  <text class="cond" x="24" y="172">・内容を書き換えられる</text>
  <text class="cond" x="24" y="192">・削除できる</text>
  <text class="cond" x="24" y="212">・日付順に並ぶ</text>

  <!-- 1 → 2 -->
  <line x1="240" y1="122" x2="284" y2="122" stroke="#1F4E79" stroke-width="1.6" marker-end="url(#arrowRight)"/>
  <text class="flow-label" x="240" y="110">渡す</text>

  <!-- 2. AIが作る -->
  <rect class="box" x="296" y="60" width="152" height="124"/>
  <rect class="bar" x="296" y="60" width="4" height="124"/>
  <text class="step-no"   x="320" y="86">2</text>
  <text class="step-name" x="320" y="110">AIが作る</text>
  <text class="step-note" x="320" y="134">画面も、裏側の</text>
  <text class="step-note" x="320" y="152">仕組みも、AIが書く</text>

  <!-- 2 → 3 -->
  <line x1="460" y1="122" x2="504" y2="122" stroke="#1F4E79" stroke-width="1.6" marker-end="url(#arrowRight)"/>
  <text class="flow-label" x="460" y="110">出てくる</text>

  <!-- 3. 確認する -->
  <rect class="box" x="516" y="60" width="124" height="124"/>
  <rect class="bar" x="516" y="60" width="4" height="124"/>
  <text class="step-no"   x="540" y="86">3</text>
  <text class="step-name" x="540" y="110">自分で確かめる</text>
  <text class="step-note" x="540" y="134">5行を1つずつ</text>
  <text class="step-note" x="540" y="152">動かして確認</text>

  <!-- 3 → 1 戻り -->
  <path d="M578 192 L578 262 L114 262 L114 232"
        fill="none" stroke="#5C6368" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#arrowBack)"/>
  <text class="flow-label" x="252" y="282">条件を満たしていなければ、書き直してもう一度</text>

  <line class="line" x1="0" y1="306" x2="640" y2="306"/>
  <text class="step-note" x="0" y="330">書いた5行が、そのまま指示書と確認表の両方になります。</text>
</svg>
