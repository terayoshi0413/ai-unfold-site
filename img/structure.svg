<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 412" role="img" aria-labelledby="structure-title structure-desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="structure-title">Webシステムの3層構造</title>
  <desc id="structure-desc">画面・処理・データの3つの層が、お願いと返答でつながっている図</desc>

  <defs>
    <marker id="arrowDown" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L5 9 L9 1" fill="none" stroke="#1F4E79" stroke-width="1.6" stroke-linecap="square"/>
    </marker>
    <marker id="arrowUp" viewBox="0 0 10 10" refX="5" refY="1" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 9 L5 1 L9 9" fill="none" stroke="#5C6368" stroke-width="1.6" stroke-linecap="square"/>
    </marker>
  </defs>

  <style>
    .layer-name { font: 700 19px "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif; fill: #1A1D1F; }
    .layer-note { font: 400 14px "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif; fill: #5C6368; }
    .flow-label { font: 400 13px "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif; fill: #5C6368; }
    .box { fill: #FFFFFF; stroke: #E3E6E8; stroke-width: 1; }
    .bar { fill: #1F4E79; }
  </style>

  <!-- 画面 -->
  <rect class="box" x="80" y="16" width="480" height="96"/>
  <rect class="bar" x="80" y="16" width="4" height="96"/>
  <text class="layer-name" x="112" y="52">画面</text>
  <text class="layer-note" x="112" y="80">人が見て、入力するところ</text>
  <text class="layer-note" x="112" y="100">一覧の表示、登録フォーム、編集ボタンなど</text>

  <!-- 画面 → 処理 -->
  <line x1="260" y1="118" x2="260" y2="146" stroke="#1F4E79" stroke-width="1.6" marker-end="url(#arrowDown)"/>
  <text class="flow-label" x="272" y="138">お願いする</text>
  <line x1="420" y1="146" x2="420" y2="118" stroke="#5C6368" stroke-width="1.6" marker-end="url(#arrowUp)"/>
  <text class="flow-label" x="432" y="138">結果が返る</text>

  <!-- 処理 -->
  <rect class="box" x="80" y="158" width="480" height="96"/>
  <rect class="bar" x="80" y="158" width="4" height="96"/>
  <text class="layer-name" x="112" y="194">処理</text>
  <text class="layer-note" x="112" y="222">やっているのは4つだけ</text>
  <text class="layer-note" x="112" y="242">見る／入れる／書き換える／捨てる</text>

  <!-- 処理 → データ -->
  <line x1="260" y1="260" x2="260" y2="288" stroke="#1F4E79" stroke-width="1.6" marker-end="url(#arrowDown)"/>
  <text class="flow-label" x="272" y="280">取りに行く</text>
  <line x1="420" y1="288" x2="420" y2="260" stroke="#5C6368" stroke-width="1.6" marker-end="url(#arrowUp)"/>
  <text class="flow-label" x="432" y="280">中身が返る</text>

  <!-- データ -->
  <rect class="box" x="80" y="300" width="480" height="96"/>
  <rect class="bar" x="80" y="300" width="4" height="96"/>
  <text class="layer-name" x="112" y="336">データ</text>
  <text class="layer-note" x="112" y="364">情報を貯めておくところ</text>
  <text class="layer-note" x="112" y="384">顧客の一覧、対応の履歴、日報の記録など</text>
</svg>
